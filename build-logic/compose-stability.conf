// Compose compiler stability configuration (wired up in build-logic Common.kt configureCompose).
//
// These modules don't apply the Compose compiler, so their classes are inferred unstable even
// though every one is a read-only data class / enum of stable fields. Declaring them stable lets
// composables taking e.g. MediaSort, AppearanceSettings or RemoteEntry skip on equals().
//
// Deliberately NOT listed: kotlin.collections.List. With strong skipping, unstable params are
// compared by identity, which is O(1); marking List stable would compare 2k-item album lists
// with equals() on every recomposition.
com.dietpizza.rxplayer.core.model.**
com.dietpizza.rxplayer.core.netfs.model.**
com.dietpizza.rxplayer.core.datastore.SubtitleSettings
// Immutable once built (graphics-shapes); used by the onboarding hero shapes.
androidx.graphics.shapes.RoundedPolygon
